apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-outbox-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-outbox-processor
  template:
    metadata:
      labels:
        app: users-outbox-processor
    spec:
      serviceAccountName: fcg-outbox-processor
      containers:
        - name: outbox-processor
          image: fcg-outbox-processor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: outbox-processor-config
          env:
            - name: Outbox__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: users-api-secrets
                  key: UsersConnectionString
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
